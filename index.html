<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تحدي الكلمات: عربي – русский</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg1:#0f1b3d;--bg2:#1d3b6e;--bg3:#2b1b56;--card:rgba(255,255,255,.08);--card2:rgba(255,255,255,.14);--gold:#ffd24a;--green:#2ecc71;--red:#ff5a6e;--blue:#4ab8ff;--pink:#ff7ad5;--txt:#f6f8ff}
html,body{height:100%}
body{font-family:"Noto Naskh Arabic","Amiri","Scheherazade New","Traditional Arabic","Segoe UI",Tahoma,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg3) 45%,var(--bg2));background-attachment:fixed;color:var(--txt);min-height:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 10%,rgba(255,210,74,.14),transparent 45%),radial-gradient(circle at 85% 80%,rgba(255,122,213,.14),transparent 45%)}
.ru{font-family:"Segoe UI",Roboto,Arial,sans-serif;direction:ltr;unicode-bidi:isolate;font-size:.72em;opacity:.85;display:block;font-weight:400}
body.hide-ru .ru{display:none !important}
#app{position:relative;max-width:1100px;margin:0 auto;padding:10px 12px 40px;z-index:2}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.logo{font-size:clamp(18px,4.4vw,30px);font-weight:800;line-height:1.3;background:linear-gradient(90deg,var(--gold),var(--pink),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.logo small{display:block;font-size:.5em;color:#cfe0ff;background:none;-webkit-text-fill-color:#cfe0ff}
.hdr-btns{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn{background:var(--card);border:1px solid rgba(255,255,255,.18);color:var(--txt);border-radius:14px;padding:8px 12px;font-size:14px;cursor:pointer;font-family:inherit;transition:.2s}
.icon-btn:hover{background:var(--card2);transform:translateY(-2px)}
.icon-btn.off{opacity:.45}
.card{background:var(--card);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:16px;backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.btn{font-family:inherit;cursor:pointer;border:none;border-radius:18px;padding:12px 20px;font-size:clamp(15px,2.6vw,20px);font-weight:700;color:#10203f;background:linear-gradient(180deg,#ffe489,var(--gold));box-shadow:0 6px 0 #c99b14,0 10px 22px rgba(0,0,0,.3);transition:.12s;line-height:1.25}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c99b14}
.btn.sec{background:linear-gradient(180deg,#6fd1ff,#2f9ce0);color:#07243a;box-shadow:0 6px 0 #1a6c9e,0 10px 22px rgba(0,0,0,.3)}
.btn.sec:active{box-shadow:0 2px 0 #1a6c9e}
.btn.danger{background:linear-gradient(180deg,#ff95a3,#ef4d63);color:#3b0712;box-shadow:0 6px 0 #a62436,0 10px 22px rgba(0,0,0,.3)}
.btn.big{font-size:clamp(18px,3.4vw,26px);padding:16px 34px;width:100%;max-width:420px;margin:14px auto 0;display:block}
.hidden{display:none !important}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{flex:1;min-width:100px;background:var(--card);border:1px solid rgba(255,255,255,.15);color:var(--txt);border-radius:16px;padding:10px;font-family:inherit;font-size:clamp(13px,2.2vw,17px);font-weight:700;cursor:pointer;transition:.2s}
.tab.active{background:linear-gradient(180deg,#ffe489,var(--gold));color:#10203f;border-color:transparent}
.tabpane{display:none;animation:fade .3s}
.tabpane.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.team-row{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.07);border-radius:16px;padding:10px;margin-bottom:10px;flex-wrap:wrap}
.emoji-pick{font-size:28px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:4px 10px;cursor:pointer}
.team-row input[type=text]{flex:1;min-width:140px;font-family:inherit;font-size:18px;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:#fff}
.chip-colors{display:flex;gap:4px}
.dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.dot.sel{border-color:#fff;transform:scale(1.15)}
.emoji-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.emoji-grid span{font-size:24px;padding:4px 7px;border-radius:10px;background:rgba(0,0,0,.25);cursor:pointer}
.emoji-grid span:hover{background:var(--gold)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed rgba(255,255,255,.15);flex-wrap:wrap}
.set-row label{font-size:clamp(15px,2.5vw,19px);font-weight:700}
input[type=range]{width:180px;accent-color:var(--gold)}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.2);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:15px;margin:3px}
.pill input{accent-color:var(--gold);width:16px;height:16px}
.pill.on{background:linear-gradient(180deg,#ffe489,var(--gold));color:#10203f;border-color:transparent;font-weight:700}
.wordlist{max-height:330px;overflow:auto;border-radius:14px;background:rgba(0,0,0,.2);padding:6px;margin-top:10px}
.word-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.word-item .ar{font-size:21px;font-weight:700;min-width:150px}
.word-item .tr{font-family:"Segoe UI",Arial;direction:ltr;color:#bcd4ff;flex:1;min-width:120px;text-align:left}
.badge{font-size:12px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.14)}
.badge.v{background:rgba(74,184,255,.3)}
.badge.f{background:rgba(255,122,213,.3)}
.badge.m{background:rgba(46,204,113,.3)}
.del{background:rgba(255,90,110,.25);border:none;color:#ffbfc8;border-radius:10px;padding:5px 10px;cursor:pointer;font-family:inherit}
.add-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.add-form input,.add-form select,textarea{font-family:inherit;font-size:16px;padding:9px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:#fff}
textarea{width:100%;height:110px;direction:ltr;font-family:monospace;font-size:12px}
.gamebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.turn-info{font-size:clamp(14px,2.4vw,18px);font-weight:700;background:var(--card);padding:8px 14px;border-radius:14px}
#timerWrap{flex:1;min-width:160px;height:34px;background:rgba(0,0,0,.35);border-radius:999px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.18)}
#timerBar{height:100%;width:100%;background:linear-gradient(90deg,#2ecc71,#8ef58e);transition:width .1s linear}
#timerText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;text-shadow:0 1px 3px #000}
.score-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.team-chip{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid transparent;border-radius:16px;padding:7px 14px;font-weight:800;font-size:clamp(14px,2.4vw,18px);transition:.25s}
.team-chip .sc{background:rgba(0,0,0,.35);border-radius:10px;padding:2px 10px;font-size:1.05em}
.team-chip.active{transform:scale(1.06);box-shadow:0 0 0 3px rgba(255,255,255,.35),0 8px 22px rgba(0,0,0,.35)}
.turn-banner{text-align:center;font-size:clamp(16px,3vw,24px);font-weight:800;margin:6px 0 10px;animation:pop .4s}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.qcard{text-align:center;margin-bottom:14px;position:relative;overflow:hidden}
.qtype{font-size:clamp(13px,2.2vw,17px);background:rgba(255,255,255,.16);display:inline-block;padding:5px 16px;border-radius:999px;margin-bottom:10px}
.prompt-ar{font-size:clamp(32px,8vw,64px);font-weight:800;line-height:1.5;color:#fff;text-shadow:0 3px 16px rgba(0,0,0,.5)}
.prompt-ru{font-family:"Segoe UI",Arial;direction:ltr;font-size:clamp(26px,6vw,48px);font-weight:700;color:#ffe489}
.sub{font-size:clamp(13px,2.2vw,16px);opacity:.75;margin-top:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{font-family:inherit;cursor:pointer;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;border-radius:18px;padding:16px;font-size:clamp(17px,3.2vw,26px);font-weight:700;transition:.15s;min-height:66px}
.opt .ru{font-size:.6em}
.opt:hover:not(:disabled){background:rgba(255,255,255,.2);transform:translateY(-3px)}
.opt.lat{font-family:"Segoe UI",Arial;direction:ltr}
.opt.correct{background:linear-gradient(180deg,#4fe08a,#1fa05b);border-color:#fff;animation:pop .35s}
.opt.wrong{background:linear-gradient(180deg,#ff8a9c,#d8384f);border-color:#fff;animation:shake .4s}
.opt:disabled{cursor:default;opacity:.85}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match-col{display:flex;flex-direction:column;gap:9px}
.mcard{font-family:inherit;cursor:pointer;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;border-radius:16px;padding:13px;font-size:clamp(17px,3.2vw,26px);font-weight:700;transition:.15s}
.mcard.lat{font-family:"Segoe UI",Arial;direction:ltr}
.mcard.sel{background:var(--gold);color:#102;transform:scale(1.03)}
.mcard.done{background:linear-gradient(180deg,#4fe08a,#1fa05b);opacity:.75;cursor:default}
.mcard.bad{animation:shake .4s;background:rgba(255,90,110,.5)}
.scram-slot{min-height:76px;border:3px dashed rgba(255,255,255,.35);border-radius:18px;display:flex;justify-content:center;align-items:center;gap:6px;font-size:clamp(28px,6vw,46px);font-weight:800;padding:8px;margin-bottom:12px;letter-spacing:2px}
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.letter{font-family:inherit;width:62px;height:62px;font-size:30px;font-weight:800;border-radius:16px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.14);color:#fff;cursor:pointer;transition:.15s}
.letter:hover{background:var(--gold);color:#102}
.letter.used{opacity:.25;cursor:default}
.reveal{margin-top:14px;text-align:center;border-radius:22px;padding:16px;animation:pop .35s}
.reveal.ok{background:linear-gradient(180deg,rgba(46,204,113,.35),rgba(46,204,113,.12));border:2px solid #2ecc71}
.reveal.no{background:linear-gradient(180deg,rgba(255,90,110,.32),rgba(255,90,110,.12));border:2px solid var(--red)}
.reveal .res{font-size:clamp(20px,4vw,30px);font-weight:800;margin-bottom:8px}
.reveal .ans-ar{font-size:clamp(28px,6vw,48px);font-weight:800}
.reveal .ans-ru{font-family:"Segoe UI",Arial;direction:ltr;font-size:clamp(20px,4vw,32px);color:#ffe489;font-weight:700}
.pts{font-size:clamp(18px,3.6vw,26px);font-weight:800;color:var(--gold);margin-top:6px}
.buzz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.buzz{font-family:inherit;cursor:pointer;border:none;border-radius:20px;padding:22px;font-size:clamp(20px,4vw,30px);font-weight:800;color:#101e3c;animation:glow 1.3s infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 rgba(255,255,255,0)}to{box-shadow:0 0 26px rgba(255,255,255,.75)}}
.wheel-box{display:flex;flex-direction:column;align-items:center;gap:14px}
.wheel-outer{position:relative;width:min(78vw,340px);height:min(78vw,340px)}
.wheel{width:100%;height:100%;border-radius:50%;border:8px solid #ffd24a;position:relative;overflow:hidden;box-shadow:0 0 34px rgba(255,210,74,.5);transition:transform 4.2s cubic-bezier(.17,.67,.17,1)}
.wseg{position:absolute;inset:0;display:flex;justify-content:center;padding-top:8%;font-size:clamp(11px,2.6vw,15px);font-weight:800;color:#0e1b38}
.wseg span{display:block;width:46%;text-align:center;line-height:1.2}
.pointer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:40px;z-index:4;filter:drop-shadow(0 3px 6px #000)}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:20px 0;flex-wrap:wrap}
.pod{border-radius:18px 18px 0 0;padding:12px;text-align:center;min-width:100px;font-weight:800;animation:rise .6s}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.pod .em{font-size:40px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:10px 22px;border-radius:999px;font-weight:800;z-index:60;font-size:18px;animation:pop .3s}
.text-item{background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px;margin-bottom:14px;position:relative}
.text-item h4{font-size:clamp(17px,3vw,22px);color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-left:180px}
.text-item h4 .tnum{background:var(--gold);color:#102;font-size:.7em;padding:2px 9px;border-radius:999px;font-weight:800}
.text-item .tx-tools{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}
.text-item .tx-tools button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:5px 10px;font-size:14px;cursor:pointer;font-family:inherit;transition:.2s}
.text-item .tx-tools button:hover{background:var(--gold);color:#102}
.tx-body{font-size:clamp(16px,2.8vw,20px);line-height:2.1;color:#fff;white-space:pre-wrap;padding:8px 4px}
.tx-body.dialog .line{margin:3px 0}
.tx-body .speaker{color:var(--blue);font-weight:800;margin-left:6px}
.tx-tr{margin-top:12px;padding-top:12px;border-top:1px dashed rgba(255,255,255,.2);font-family:"Segoe UI",Arial;direction:ltr;text-align:left;color:#cfe0ff;font-size:clamp(13px,2.3vw,16px);line-height:1.9;white-space:pre-wrap}
.tx-tr.hidden{display:none}
body.reading-mode .text-item{background:rgba(255,255,255,.04);border-color:transparent}
body.reading-mode .text-item .tx-tr{display:none !important}
body.reading-mode .text-item .tx-tools button[data-t="ru"]{display:none}
.tx-quiz{margin-top:14px;padding-top:14px;border-top:1px dashed rgba(255,255,255,.25)}
.tx-quiz .q-head{font-size:clamp(15px,2.5vw,19px);font-weight:800;color:var(--gold);margin-bottom:10px}
.tx-quiz .q-text{font-size:clamp(17px,3vw,22px);font-weight:800;color:#fff;margin-bottom:10px}
.tx-quiz .q-opts{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px}
.tx-quiz .q-opt{font-family:inherit;cursor:pointer;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;border-radius:14px;padding:12px 16px;font-size:clamp(15px,2.6vw,20px);font-weight:700;transition:.15s;text-align:right}
.tx-quiz .q-opt:hover:not(:disabled){background:rgba(255,255,255,.18)}
.tx-quiz .q-opt.correct{background:linear-gradient(180deg,#4fe08a,#1fa05b);border-color:#fff}
.tx-quiz .q-opt.wrong{background:linear-gradient(180deg,#ff8a9c,#d8384f);border-color:#fff}
.tx-quiz .q-opt:disabled{cursor:default;opacity:.9}
.tx-quiz .q-progress{font-size:14px;opacity:.75;margin-bottom:6px}
.tx-quiz .q-final{text-align:center;padding:20px}
.tx-quiz .q-final .score{font-size:clamp(30px,7vw,52px);font-weight:800;color:var(--gold);margin:10px 0}
@media(max-width:560px){.match-wrap{gap:6px}.letter{width:52px;height:52px;font-size:25px}.opts{grid-template-columns:1fr}.text-item h4{padding-left:0;padding-top:36px}}
</style>
</head>
<link rel="icon" type="image/png" href="icon.png">
<body>
<canvas id="fx"></canvas>
<div id="app">
  <header>
    <div class="logo">🏆 تحدي الكلمات: عربي – русский
      <small class="ru">Словарный турнир: арабский — русский</small></div>
    <div class="hdr-btns">
      <button class="icon-btn" id="ruToggle">🇷🇺 الترجمة الروسية: ظاهرة</button>
      <button class="icon-btn" id="sndToggle">🔊 الصوت</button>
      <button class="icon-btn hidden" id="quitBtn">⏹ إنهاء<span class="ru">Стоп</span></button>
    </div>
  </header>

  <section id="screen-start">
    <div class="tabs">
      <button class="tab active" data-tab="teams">👥 الفرق<span class="ru">Команды</span></button>
      <button class="tab" data-tab="settings">⚙️ الإعدادات<span class="ru">Настройки</span></button>
      <button class="tab" data-tab="words">📚 الكلمات<span class="ru">Слова</span></button>
      <button class="tab" data-tab="texts">📖 النصوص<span class="ru">Тексты</span></button>
    </div>

    <div class="tabpane active" id="tab-teams">
      <div class="card">
        <h3 style="margin-bottom:10px">اختر أسماء الفرق ورموزها <span class="ru">Выберите названия и символы команд</span></h3>
        <div id="teamsBox"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
          <button class="btn sec" id="addTeam">➕ فريق جديد<span class="ru">Добавить команду</span></button>
          <button class="btn danger" id="delTeam">➖ حذف فريق<span class="ru">Удалить</span></button>
        </div>
        <button class="btn big" id="startBtn">▶ ابدأ اللعب<span class="ru">Начать игру</span></button>
      </div>
    </div>

    <div class="tabpane" id="tab-settings">
      <div class="card">
        <div class="set-row"><label>⏱ زمن السؤال <span class="ru">Время на вопрос</span></label>
          <div><input type="range" id="sTime" min="15" max="40" step="5" value="25"> <b id="sTimeV">25 ث</b></div></div>
        <div class="set-row"><label>🔢 عدد الأسئلة <span class="ru">Количество вопросов</span></label>
          <div><input type="range" id="sQ" min="6" max="40" step="2" value="14"> <b id="sQV">14</b></div></div>
        <div class="set-row"><label>🎡 عجلة عشوائية كل ٤ أسئلة <span class="ru">Колесо каждые 4 вопроса</span></label>
          <input type="checkbox" id="sWheel" checked style="width:24px;height:24px;accent-color:#ffd24a"></div>
        <div class="set-row"><label>⚔️ تحدي بين فريقين <span class="ru">Дуэль команд</span></label>
          <input type="checkbox" id="sDuel" checked style="width:24px;height:24px;accent-color:#ffd24a"></div>
        <div style="padding:10px 0"><b>أنواع الأسئلة <span class="ru">Типы вопросов</span></b><div id="typesBox" style="margin-top:6px"></div></div>
        <div style="padding:10px 0"><b>فئات الكلمات <span class="ru">Категории слов</span></b>
          <div style="font-size:13px;opacity:.7;margin-top:4px">✓ اختر المجالات التي تريد اختبار الطلاب فيها
            <span class="ru">Выберите категории для игры</span></div>
          <div id="catsBox" style="margin-top:6px"></div>
          <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
            <button class="icon-btn" id="catsAll">✅ تحديد الكل</button>
            <button class="icon-btn" id="catsNone">❌ إلغاء الكل</button>
          </div>
        </div>
      </div>
    </div>

    <div class="tabpane" id="tab-words">
      <div class="card">
        <h3>📚 بنك الكلمات <span class="ru">Банк слов</span></h3>
        <div class="add-form">
          <select id="wType"><option value="n">اسم / Имя</option><option value="v">فعل / Глагол</option></select>
          <input id="wAr" placeholder="الاسم المفرد — مَدْرَسَة" style="min-width:150px">
          <input id="wPast" class="hidden" placeholder="الماضي — كَتَبَ" style="min-width:130px">
          <input id="wPres" class="hidden" placeholder="المضارع — يَكْتُبُ" style="min-width:130px">
